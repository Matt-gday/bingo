<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound effects tester</title>
<style>
  :root { --purple:#5236d6; --deep:#2b1b6b; --aqua:#2ee6d6; --soft:#f1ecff; --edge:#d6ccfa; --magenta:#c92a86; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 system-ui, "Segoe UI", sans-serif; color:var(--deep); background:#f7f4ff; }
  header { background:linear-gradient(170deg,#5236d6,#7b45e6 55%,#c257d9); color:#fff; padding:22px 24px 18px; }
  header h1 { margin:0 0 4px; font-size:28px; }
  header p { margin:0; opacity:.9; }
  .bar { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 24px; background:#fff; border-bottom:2px solid var(--edge); }
  .bar input[type=search] { flex:1; min-width:200px; padding:9px 14px; font-size:16px; border:2px solid var(--edge); border-radius:999px; }
  .bar button, .section button.play-all { border:0; border-radius:999px; padding:9px 16px; font-size:15px; font-weight:700; cursor:pointer; background:var(--aqua); color:#1a1446; }
  .bar button.stop { background:var(--magenta); color:#fff; }
  .bar label { font-size:14px; display:flex; gap:6px; align-items:center; }
  .now { font-size:14px; color:var(--purple); min-width:160px; }
  main { max-width:1000px; margin:0 auto; padding:16px 24px 80px; }
  nav { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 4px; }
  nav a { text-decoration:none; background:var(--soft); color:var(--deep); padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600; }
  section.section { margin-top:22px; background:#fff; border:2px solid var(--edge); border-radius:18px; overflow:hidden; }
  .section > summary { list-style:none; cursor:pointer; padding:14px 18px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--soft); }
  .section > summary h2 { margin:0; font-size:20px; flex:1 1 auto; }
  .count { font-size:13px; font-weight:700; color:var(--purple); background:#fff; border-radius:999px; padding:2px 10px; }
  .blurb { padding:10px 18px 0; margin:0; color:#5b4a9e; font-size:14px; }
  table { width:100%; border-collapse:collapse; }
  td { padding:7px 14px; border-top:1px solid var(--soft); vertical-align:middle; }
  td.btn { width:54px; }
  td.line { font-weight:600; }
  td.tag { font-size:12px; color:#7c6cc4; width:34%; }
  .hide-tags td.tag, .hide-tags th.tag { display:none; }
  button.p { width:38px; height:38px; border:0; border-radius:50%; background:var(--purple); color:#fff; font-size:15px; cursor:pointer; }
  button.p:disabled { background:#cfc8ee; cursor:not-allowed; }
  tr.playing td { background:#e8fffc; }
  tr.playing button.p { background:var(--magenta); }
  tr.missing td.line { color:#a39bc9; }
  tr.hidden { display:none; }
  .none { padding:14px 18px; color:#7c6cc4; }
  @media (max-width:640px) { td.tag { display:none; } }
</style>
</head>
<body>
<header>
  <h1>Sound effects tester</h1>
  <p>Click a ▶ to hear a line. Lines are grouped by theme. The small text shows the delivery tag that was used.</p>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="Search a line, a number or a name...">
  <label><input type="checkbox" id="auto"> keep going to the next line</label>
  <label><input type="checkbox" id="tags" checked> show tags</label>
  <button class="stop" id="stop">■ Stop</button>
  <span class="now" id="now"></span>
</div>
<main>
  <nav id="jump"></nav>
  <div id="sections"></div>
</main>
<script>
const FOLDER = "public/audio/sfx/";
const DATA = [{"id":"calling","title":"Calling","blurb":"","rows":[{"text":"ball-land (take 1): A new number is called.","file":"ball-land-1-c81f4aa01c.mp3","tag":"A soft rubber bingo ball landing with one gentle bounce, a low rounded boop, playful and warm, short, no clicks, not harsh, not loud"},{"text":"ball-land (take 2): A new number is called.","file":"ball-land-2-ac147cfc77.mp3","tag":"A soft rubber bingo ball landing with one gentle bounce, a low rounded boop, playful and warm, short, no clicks, not harsh, not loud"},{"text":"ball-land (take 3): A new number is called.","file":"ball-land-3-547e674aa3.mp3","tag":"A soft rubber bingo ball landing with one gentle bounce, a low rounded boop, playful and warm, short, no clicks, not harsh, not loud"},{"text":"number-flick (take 1): The called number flies into its pill.","file":"number-flick-1-59112546b8.mp3","tag":"A quick light airy whoosh with a faint sparkle, soft and short, no clicks, not harsh, not loud"},{"text":"number-flick (take 2): The called number flies into its pill.","file":"number-flick-2-60bd36b4e0.mp3","tag":"A quick light airy whoosh with a faint sparkle, soft and short, no clicks, not harsh, not loud"},{"text":"ball-skip (take 1): The player taps the ball to skip to the next call.","file":"ball-skip-1-cda8f9ad4f.mp3","tag":"A soft light tap followed by a gentle short swoosh, rounded and friendly, no sharp click, not loud"},{"text":"ball-skip (take 2): The player taps the ball to skip to the next call.","file":"ball-skip-2-f6c356702e.mp3","tag":"A soft light tap followed by a gentle short swoosh, rounded and friendly, no sharp click, not loud"}]},{"id":"marking","title":"Marking","blurb":"","rows":[{"text":"mark-pop (take 1): A mark is placed on a square.","file":"mark-pop-1-e667e058b9.mp3","tag":"A tiny cute bubble pop, bright and clean, very short"},{"text":"mark-pop (take 2): A mark is placed on a square.","file":null,"tag":"A tiny cute bubble pop, bright and clean, very short"},{"text":"mark-pop (take 3): A mark is placed on a square.","file":null,"tag":"A tiny cute bubble pop, bright and clean, very short"},{"text":"mark-pop (take 4): A mark is placed on a square.","file":null,"tag":"A tiny cute bubble pop, bright and clean, very short"},{"text":"mark-undo (take 1): A mark is taken back or moved.","file":"mark-undo-1-e5d233663e.mp3","tag":"A tiny reverse bubble sucking pop, soft and rounded, very short, not harsh, not loud"},{"text":"mark-undo (take 2): A mark is taken back or moved.","file":"mark-undo-2-cd805d3c75.mp3","tag":"A tiny reverse bubble sucking pop, soft and rounded, very short, not harsh, not loud"},{"text":"lock-thud (take 1): The ring runs out and the marks lock.","file":"lock-thud-1-f89879c0c4.mp3","tag":"A low, soft, rounded thud, like a heavy rubber stamp or a wooden block landing gently on a thick cushion, deep and warm and muffled with a short weighty body, satisfying and solid, no click, no clack, no high-pitched tones, no metallic ring, not loud"},{"text":"lock-thud (take 2): The ring runs out and the marks lock.","file":"lock-thud-2-2e70dc558b.mp3","tag":"A low, soft, rounded thud, like a heavy rubber stamp or a wooden block landing gently on a thick cushion, deep and warm and muffled with a short weighty body, satisfying and solid, no click, no clack, no high-pitched tones, no metallic ring, not loud"},{"text":"lock-thud (take 3): The ring runs out and the marks lock.","file":"lock-thud-3-62e44817a7.mp3","tag":"A low, soft, rounded thud, like a heavy rubber stamp or a wooden block landing gently on a thick cushion, deep and warm and muffled with a short weighty body, satisfying and solid, no click, no clack, no high-pitched tones, no metallic ring, not loud"},{"text":"lock-thud (take 4): The ring runs out and the marks lock.","file":"lock-thud-4-1d6b52dca0.mp3","tag":"A low, soft, rounded thud, like a heavy rubber stamp or a wooden block landing gently on a thick cushion, deep and warm and muffled with a short weighty body, satisfying and solid, no click, no clack, no high-pitched tones, no metallic ring, not loud"}]},{"id":"calling-bingo","title":"Calling bingo","blurb":"","rows":[{"text":"claim-whoosh: The player taps Call bingo.","file":null,"tag":"A quick light rising whoosh with a tiny sparkle, bright and gentle, not harsh, short"},{"text":"too-slow: The next number came before the player finished calling.","file":null,"tag":"A short comical boing followed by a little deflating squeak, playful not sad"}]},{"id":"the-check","title":"The check","blurb":"","rows":[{"text":"check-tick (take 1): A number in the checked pattern turns out valid.","file":"check-tick-1-60e432c235.mp3","tag":"A bright happy ding like a correct-answer chime on a glockenspiel, rounded and warm, short, not harsh, not loud"},{"text":"check-tick (take 2): A number in the checked pattern turns out valid.","file":"check-tick-2-35e21ba0a2.mp3","tag":"A bright happy ding like a correct-answer chime on a glockenspiel, rounded and warm, short, not harsh, not loud"},{"text":"check-tick (take 3): A number in the checked pattern turns out valid.","file":"check-tick-3-b39f671b80.mp3","tag":"A bright happy ding like a correct-answer chime on a glockenspiel, rounded and warm, short, not harsh, not loud"},{"text":"check-cross: A number in the checked pattern is not valid.","file":null,"tag":"A friendly cartoon wrong-answer buzzer, short, low and soft, not harsh, not scary"},{"text":"check-build: The slow, dramatic last number of a check.","file":null,"tag":"A rising tension build with a drum roll swelling louder and louder, then stopping dead, suspenseful and playful"}]},{"id":"winning-and-losing","title":"Winning and losing","blurb":"","rows":[{"text":"win-fanfare: The player wins a stage.","file":"win-fanfare-5-b7a3cbcbd2.mp3","tag":"A joyful, uplifting win celebration jingle with a bright ascending melody that climbs higher and higher and ends on a big happy final chord, played on xylophone, glockenspiel, warm strings and a soft bouncy bass, with light applause and a gentle crowd cheer at the end, fun and triumphant, full and rich, not a tinkly piano, no harsh horns, no whistles, not too loud"},{"text":"false-call (take 1): A claim fails the check.","file":null,"tag":"A gentle comical sad trombone wah-wah wah-waaah, friendly and short, not harsh"},{"text":"false-call (take 2): A claim fails the check.","file":null,"tag":"A gentle comical sad trombone wah-wah wah-waaah, friendly and short, not harsh"}]},{"id":"pause","title":"Pause","blurb":"","rows":[{"text":"countdown-beep: Each number of the 3, 2, 1 after a pause.","file":null,"tag":"A clean friendly countdown beep, single short tone"},{"text":"countdown-go: The game carries on after the 3, 2, 1.","file":null,"tag":"A higher bright friendly beep with a tiny sparkle, signalling go, short"},{"text":"pause-on: The game pauses.","file":null,"tag":"A cute soft click with a short descending tone, pausing"}]},{"id":"buttons","title":"Buttons","blurb":"","rows":[{"text":"button-tap (take 1): Any button is tapped.","file":"button-tap-1-7281d2f00a.mp3","tag":"A soft cute rounded button tap, a gentle tup, very short, no sharp click, not loud"},{"text":"button-tap (take 2): Any button is tapped.","file":"button-tap-2-f3e9c210ad.mp3","tag":"A soft cute rounded button tap, a gentle tup, very short, no sharp click, not loud"},{"text":"button-tap (take 3): Any button is tapped.","file":"button-tap-3-1874b01db0.mp3","tag":"A soft cute rounded button tap, a gentle tup, very short, no sharp click, not loud"}]},{"id":"coming-in-later-phases","title":"Coming in later phases","blurb":"","rows":[{"text":"stage-won: A stage is won and the night continues.","file":null,"tag":"A short joyful ascending jingle on xylophone and glockenspiel with warm strings, the notes climbing upward and ending on a bright happy chord, upbeat and smooth, no harsh horns, not loud"},{"text":"gem-chime (take 1): Credits are banked.","file":null,"tag":"A sparkling magical gem chime, credits earned, short and bright"},{"text":"gem-chime (take 2): Credits are banked.","file":null,"tag":"A sparkling magical gem chime, credits earned, short and bright"},{"text":"prize-drop (take 1): A new prize drops onto the table.","file":null,"tag":"A cute chunky toy dropping onto a wooden table with a springy bounce"},{"text":"prize-drop (take 2): A new prize drops onto the table.","file":null,"tag":"A cute chunky toy dropping onto a wooden table with a springy bounce"},{"text":"prize-drop (take 3): A new prize drops onto the table.","file":null,"tag":"A cute chunky toy dropping onto a wooden table with a springy bounce"},{"text":"buy: A prize is bought.","file":null,"tag":"A cheerful cash register cha-ching with a sparkle, short"},{"text":"badge-gold: A set is finished first (gold badge).","file":null,"tag":"A shimmering golden achievement sparkle with a bright triumphant chime"},{"text":"badge-silver: A set is finished later (silver badge).","file":null,"tag":"A shimmering silver achievement chime, lighter and gentler than gold"},{"text":"sold: A prize sells to a regular.","file":null,"tag":"A rubber stamp thump with a tiny bell ding, short"},{"text":"ring-close: A regular's buying ring closes.","file":null,"tag":"A tiny clock tick with a soft pop, a countdown closing, very short"},{"text":"table-open: The prize table opens.","file":null,"tag":"A bright shop doorbell ding with a small whoosh, welcoming"},{"text":"regular-cheer: A regular wins.","file":null,"tag":"A short, friendly crowd of people saying hooray with light applause, warm and pleasant, not shouty"},{"text":"regular-groan: A regular loses a prize or is told off.","file":null,"tag":"A short sympathetic cartoon aww groan from a small crowd"},{"text":"regular-gasp: Someone shouts bingo and the others are shocked.","file":null,"tag":"A short comic surprised gasp, oooh, playful"}]}];

const audio = new Audio();
let playing = null;      // the row being played
let queue = [];          // rows still to play when "play all" or "keep going" is on
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const rowsAll = [];

function stopAll() {
  audio.pause(); queue = [];
  if (playing) playing.classList.remove('playing');
  playing = null; document.getElementById('now').textContent = '';
}

function playRow(tr, rest) {
  if (!tr.dataset.file) return;
  if (playing) playing.classList.remove('playing');
  playing = tr; tr.classList.add('playing');
  if (rest) queue = rest;
  document.getElementById('now').textContent = tr.dataset.text;
  audio.src = FOLDER + tr.dataset.file;
  audio.play().catch(() => {});
}

function visibleRowsAfter(tr) {
  const list = rowsAll.filter((r) => !r.classList.contains('hidden') && r.dataset.file);
  const i = list.indexOf(tr);
  return i < 0 ? [] : list.slice(i + 1);
}

audio.addEventListener('ended', () => {
  if (playing) playing.classList.remove('playing');
  const next = queue.shift();
  if (next) playRow(next);
  else { playing = null; document.getElementById('now').textContent = ''; }
});

const sectionsEl = document.getElementById('sections');
const jump = document.getElementById('jump');
for (const s of DATA) {
  const det = el('details', 'section'); det.id = s.id; det.open = true; det.className = 'section';
  const sum = el('summary'); sum.append(el('h2', '', s.title), el('span', 'count', s.rows.length + ' lines'));
  const all = el('button', 'play-all', '▶ Play all'); all.className = 'play-all';
  all.addEventListener('click', (e) => { e.preventDefault(); const rs = rowsAll.filter((r) => r.dataset.section === s.id && !r.classList.contains('hidden') && r.dataset.file); if (rs.length) playRow(rs[0], rs.slice(1)); });
  sum.append(all); det.append(sum);
  if (s.blurb) det.append(el('p', 'blurb', s.blurb));
  const table = el('table'); const tbody = el('tbody');
  for (const row of s.rows) {
    const tr = el('tr'); tr.dataset.section = s.id; tr.dataset.text = row.text; if (row.file) tr.dataset.file = row.file; else tr.classList.add('missing');
    const b = el('td', 'btn'); const btn = el('button', 'p', '▶'); btn.className = 'p'; btn.disabled = !row.file; btn.setAttribute('aria-label', 'Play: ' + row.text);
    btn.addEventListener('click', () => { if (playing === tr && !audio.paused) { stopAll(); return; } playRow(tr, document.getElementById('auto').checked ? visibleRowsAfter(tr) : []); });
    b.append(btn); tr.append(b, el('td', 'line', row.text + (row.file ? '' : '   (not recorded yet)')), el('td', 'tag', row.tag));
    tbody.append(tr); rowsAll.push(tr);
  }
  table.append(tbody); det.append(table); sectionsEl.append(det);
  const a = el('a', '', s.title); a.href = '#' + s.id; jump.append(a);
}

document.getElementById('stop').addEventListener('click', stopAll);
document.getElementById('tags').addEventListener('change', (e) => document.body.classList.toggle('hide-tags', !e.target.checked));
document.getElementById('q').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  for (const r of rowsAll) r.classList.toggle('hidden', q !== '' && !r.dataset.text.toLowerCase().includes(q));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') stopAll(); });
</script>
</body>
</html>
