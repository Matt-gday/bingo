<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Square states mock-up</title>
<style>
  body { margin: 0; padding: 16px; background: #5a2fdc; font-family: system-ui, sans-serif; color: #fff; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  .row { display: flex; gap: 22px; align-items: flex-start; flex-wrap: wrap; }
  .cell { text-align: center; font-size: 12px; }
  .card { background: #fff; border-radius: 20px; padding: 14px 18px 18px; box-shadow: 0 6px 0 rgba(43,27,107,.5); }
  .sq { position: relative; isolation: isolate; width: 56px; height: 50px; margin-bottom: 6px; display: flex; align-items: center; justify-content: center;
        font: 600 22px/1 system-ui; color: #2b1b6b; }
  .sq::before, .sq::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 12px; }
  .sq::before { background: radial-gradient(ellipse at 36% 24%, #fff 0%, #f7f3ff 38%, #e6dcff 78%, #d9ccff 100%);
        box-shadow: 0 0 0 1px #d9d9e3, 0 3px 0 #c9bcf2, 0 7px 9px rgba(70,40,150,.3), inset 0 3px 3px #fff, inset 0 -5px 7px rgba(110,80,200,.24); }
  .sq::after { opacity: 0; }
  .sq.pending, .sq.locked { color: #fff; padding-top: 3px; }
  .sq.pending { color: #06322f; }
  .sq.pending::before, .sq.locked::before { opacity: 0; }
  .sq.pending::after, .sq.locked::after { opacity: 1; }
  .sq.pending::after { background: linear-gradient(180deg, #0c9b8f 0%, #1fcfc0 38%, #7ff3ea 100%);
        box-shadow: 0 0 0 2px #46e07a, 0 0 7px 2px rgba(70,224,122,.65), inset 0 6px 9px rgba(0,70,64,.55), inset 0 -2px 4px rgba(220,255,252,.7); }
  .sq.locked::after { background: linear-gradient(180deg, #3c1aa8 0%, #5a2fdc 38%, #7b52f6 100%);
        box-shadow: 0 0 0 1px #d9d9e3, inset 0 6px 9px rgba(15,0,90,.6), inset 0 -2px 4px rgba(190,170,255,.55), 0 1px 0 rgba(255,255,255,.75); }
</style></head><body>
<h2>The three states</h2>
<div class="row">
  <div class="cell"><div class="card"><div class="sq">23</div></div>1. Not marked</div>
  <div class="cell"><div class="card"><div class="sq pending">23</div></div>2. Just pressed (green glow, can still move)</div>
  <div class="cell"><div class="card"><div class="sq locked">23</div></div>3. Locked (glow gone)</div>
</div>
<h2>In a row</h2>
<div class="card" style="display:inline-flex;gap:8px;padding-bottom:14px"><div class="sq">7</div><div class="sq locked">14</div><div class="sq pending">32</div><div class="sq">48</div><div class="sq locked">61</div></div>
</body></html>
